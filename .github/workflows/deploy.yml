name: Production Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Latest Git Version
    runs-on: ubuntu-latest
    steps:
      # SSH (port 22) is firewalled on the cPanel host, so deployment is triggered through
      # the HTTPS webhook (backend/blitz_backend/views.py), which runs /home/decodexe/deploy.sh.
      - name: Trigger deploy webhook
        env:
          WEBHOOK_URL: https://backend.decodexe.com/api/webhook/github-deploy/
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          BODY=$(printf '{"ref":"refs/heads/main","after":"%s","head_commit":{"id":"%s","message":"GitHub Actions deploy"}}' "$GITHUB_SHA" "$GITHUB_SHA")
          SIG_HEADER=()
          if [ -n "$WEBHOOK_SECRET" ]; then
            SIG="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')"
            SIG_HEADER=(-H "X-Hub-Signature-256: $SIG")
          fi
          curl --fail-with-body -sS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            "${SIG_HEADER[@]}" \
            -d "$BODY"
