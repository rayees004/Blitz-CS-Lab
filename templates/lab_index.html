<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Labs | Blitz Academy</title>
    <style>
      body { font-family: Arial, sans-serif; background: #07111f; color: #edf7ff; margin: 0; }
      .container { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
      .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 18px; }
      a { color: #7ae7ff; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>My Labs</h1>
      <div class="grid">
        {% for lab in labs %}
          <div class="card">
            <strong>{{ lab.lab_id }}</strong>
            <h3>{{ lab.name }}</h3>
            <p>{{ lab.difficulty }} • {{ lab.points }} pts</p>
            <a href="/labs/{{ lab.pk }}/">Open Lab</a>
          </div>
        {% empty %}
          <div class="card">No labs assigned yet.</div>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
