<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ material.title }} | Blitz Academy</title>
    <style>
      body { font-family: Arial, sans-serif; background: #07111f; color: #edf7ff; margin: 0; }
      .container { max-width: 900px; margin: 0 auto; padding: 30px 20px; }
      .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 24px; }
      .btn { background: linear-gradient(135deg, #00d1ff, #5d7cff); color: white; padding: 10px 18px; border-radius: 10px; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <p style="color:#7ae7ff; text-transform:uppercase; letter-spacing:2px;">Study Material</p>
        <h1>{{ material.title }}</h1>
        <p>{{ material.description }}</p>
        <p><strong>Category:</strong> {{ material.category }}</p>
        <p><strong>File Type:</strong> {{ material.file_type }}</p>
        <p><strong>Version:</strong> {{ material.version }}</p>
        <a class="btn" href="/dashboard/">Back to dashboard</a>
      </div>
    </div>
  </body>
</html>
